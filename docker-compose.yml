services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: oceanwatch_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oceanwatch_db
    ports:
      - "5433:5432"
    volumes:
      - D:/oceanwatch_data/postgres:/var/lib/postgresql/data

  airflow-webserver:
    image: apache/airflow:2.7.1-python3.10
    container_name: oceanwatch_airflow
    restart: always
    depends_on:
      - postgres
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://postgres:password@postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "8080:8080"
    volumes:
      - D:/oceanwatch-ai/dags:/opt/airflow/dags
    command: bash -c "airflow db migrate && airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@oceanwatch.com --password admin || true && airflow webserver & airflow scheduler"

volumes:
  airflow_data:
services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: oceanwatch_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oceanwatch_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - oceanwatch

  airflow-init:
    image: oceanwatch-airflow:2.7.1
    container_name: oceanwatch_airflow_init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:password@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: oceanwatch_airflow_shared_secret_key_2026
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./oceanwatch_transformations:/opt/airflow/oceanwatch_transformations
      - ./data:/opt/airflow/data
      - ./reports:/opt/airflow/data/reports
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --firstname Admin --lastname User --role Admin --email admin@oceanwatch.com --password admin || true
    networks:
      - oceanwatch

  airflow-webserver:
    image: oceanwatch-airflow:2.7.1
    container_name: oceanwatch_airflow_web
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:password@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: oceanwatch_airflow_shared_secret_key_2026
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./oceanwatch_transformations:/opt/airflow/oceanwatch_transformations
      - ./data:/opt/airflow/data
      - ./reports:/opt/airflow/data/reports
      - ./models:/opt/airflow/models
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - oceanwatch

  airflow-scheduler:
    image: oceanwatch-airflow:2.7.1
    container_name: oceanwatch_airflow_scheduler
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:password@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: oceanwatch_airflow_shared_secret_key_2026
    volumes:
      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./oceanwatch_transformations:/opt/airflow/oceanwatch_transformations
      - ./data:/opt/airflow/data
      - ./reports:/opt/airflow/data/reports
      - ./models:/opt/airflow/models
    command: scheduler
    networks:
      - oceanwatch

  api:
    image: python:3.10-slim
    container_name: oceanwatch_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OCEANWATCH_DB_URI: postgresql://postgres:password@postgres:5432/oceanwatch_db
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app/api
    working_dir: /app
    command: >
      bash -c "pip install --no-cache-dir fastapi uvicorn sqlalchemy psycopg2-binary
      && uvicorn api.main:app --host 0.0.0.0 --port 8000"
    networks:
      - oceanwatch

volumes:
  postgres_data:

networks:
  oceanwatch:
    name: oceanwatch-ai_oceanwatch
version: 2

sources:
  - name: ocean_raw
    schema: public
    tables:
      - name: raw_tides
        description: "Raw tide data ingested from NOAA"
        columns:
          - name: t
            tests: [not_null]
          - name: v
            tests: [not_null]

      - name: raw_sst_daily
        description: "Daily mean Sea Surface Temperature from Copernicus"
        columns:
          - name: time
            tests: [not_null]
          - name: thetao_mean
            tests: [not_null]

      - name: raw_chl_daily
        description: "Daily mean Chlorophyll-a from Copernicus"
        columns:
          - name: time
            tests: [not_null]
          - name: CHL_mean
            quote: true          # important – keeps the original case
            tests: [not_null]

models:
  - name: stg_tides
    description: "Cleaned and typed tide observations"
    columns:
      - name: observation_time
        tests: [not_null, unique]
      - name: tide_height_meters
        tests: [not_null]
      - name: loaded_at
        tests: [not_null]

  - name: dim_date
    description: "Date dimension"
    columns:
      - name: date_key
        tests: [not_null, unique]

  - name: dim_location
    description: "Location dimension for Western Indian Ocean / Mombasa"
    columns:
      - name: location_key
        tests: [not_null, unique]

  - name: fact_ocean_conditions
    description: "Daily ocean conditions (SST + Chlorophyll + Tides)"
    columns:
      - name: date_key
        tests: [not_null]
      - name: location_key
        tests: [not_null]